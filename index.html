<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="info-bar">
        <div class="info-bar__time">1:57</div>
        <div class="info-bar__icons">
          <img src="assets/wifi.svg" alt="wifi" />
          <img src="assets/chart-bar.svg" alt="chart-bar" />
          <img src="assets/battery.svg" alt="battery" />
        </div>
      </div>
      <div class="menu-bar">
        <div class="menu-bar__location">
          <div>중화동</div>
          <div class="menu-bar__location-icon">
            <img src="assets/arrow.svg" alt="arrow-down" />
          </div>
        </div>
        <div class="menu-bar__icons">
          <img src="assets/menu.svg" alt="menu" />
          <img src="assets/search.svg" alt="search" />
          <img src="assets/bell.svg" alt="bell" />
        </div>
      </div>
      <div class="list-bar">
        <div class="list-bar__1">
          <img src="assets/search_em.svg" alt="search_em" />
          <div>알바</div>
        </div>
        <div class="list-bar__2">
          <img src="assets/house.svg" alt="house" />
          <div>부동산</div>
        </div>
        <div class="list-bar__3">
          <img src="assets/car.svg" alt="car" />
          <div>중고차</div>
        </div>
      </div>
    </header>
    <main>
      <div class="item-list">
        <div class="item-list__img"><img src="assets/img.svg" alt="img" /></div>
        <div class="item-list__info">
          <div class="item-list__info-title">
            새상품)베베드피노 컬러베어 나시 100사이즈
          </div>
          <div class="item-list__info-meta">2.1km 신내동 6분 전</div>
          <div class="item-list__info-price">5,000원</div>
        </div>
      </div>
      <div class="item-list">
        <div class="item-list__img"><img src="assets/img.svg" alt="img" /></div>
        <div class="item-list__info">
          <div class="item-list__info-title">
            베베드피노 여름 상하복 세트 100
          </div>
          <div class="item-list__info-meta">면목제2동 24분 전</div>
          <div class="item-list__info-price">20,000원</div>
        </div>
      </div>
      <div class="item-list">
        <div class="item-list__img"><img src="assets/img.svg" alt="img" /></div>
        <div class="item-list__info">
          <div class="item-list__info-title">퍼혼했어요,,</div>
          <div class="item-list__info-meta">상봉동 15분 전</div>
          <div class="item-list__info-price">200,000원</div>
        </div>
      </div>
      <div class="item-list">
        <div class="item-list__img"><img src="assets/img.svg" alt="img" /></div>
        <div class="item-list__info">
          <div class="item-list__info-title">아기 크록스 c6</div>
          <div class="item-list__info-meta">묵동 46분 전</div>
          <div class="item-list__info-price">18,000원</div>
        </div>
      </div>
    </main>
    <footer>
      <div class="footer-block">
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/solidhome.svg" alt="home" />
          </div>
          <div>홈</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/paper.svg" alt="paper" />
          </div>
          <div>동네생활</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/mappin.svg" alt="mappin" />
          </div>
          <div>동네지도</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/chat.svg" alt="chat" />
          </div>
          <div>채팅</div>
        </div>
        <div class="footer-icons">
          <div class="footer-icons__img">
            <img src="assets/user.svg" alt="user" />
          </div>
          <div>나의 당근</div>
        </div>
      </div>
      <div class="write-button">+ 글쓰기</div>
    </footer>
    <div class="media-info-msg">화면 사이즈를 줄여주세요.</div>
  </body>
</html>
